<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>与客服对话</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
        }
        .chat-container {
            width: 500px;
            height: 85vh;
            background: #fff;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.3);
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }
        .chat-header {
            background: #07c160;
            color: #fff;
            padding: 15px 20px;
            font-size: 16px;
            font-weight: 500;
        }
        #messages { 
            flex: 1;
            overflow-y: auto; 
            padding: 15px; 
            background: #f5f5f5;
            display: flex;
            flex-direction: column;
        }
        .msg {
            margin: 8px 0;
            padding: 10px 14px;
            border-radius: 12px;
            max-width: 75%;
            word-wrap: break-word;
            font-size: 14px;
            line-height: 1.4;
        }
        .msg-user {
            background: #95ec69;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }
        .msg-kefu {
            background: #e8f5e9;
            align-self: flex-start;
            border-bottom-left-radius: 4px;
        }
        #inputArea { 
            padding: 12px; 
            display: flex; 
            gap: 10px; 
            border-top: 1px solid #eee;
            background: #fff;
        }
        #msgInput { 
            flex: 1; 
            padding: 10px 12px; 
            border: 1px solid #ddd;
            border-radius: 20px;
            outline: none;
            font-size: 14px;
        }
        #msgInput:focus {
            border-color: #07c160;
        }
        #inputArea button { 
            padding: 8px 20px;
            background: #07c160;
            color: #fff;
            border: none;
            border-radius: 20px;
            cursor: pointer;
            font-size: 14px;
        }
        #inputArea button:hover {
            background: #06ad56;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">在线客服</div>
        <div id="messages"></div>
        <div id="inputArea">
            <input type="text" id="msgInput" placeholder="输入消息..." onkeydown="if(event.key==='Enter')sendMsg()">
            <button onclick="sendMsg()">发送</button>
        </div>
    </div>

    <script src="./public/config.js"></script>
    <script>
        let line = 0;
        let clientId = localStorage.getItem('clientId');
        if (!clientId) {
            clientId = 'client_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);
            localStorage.setItem('clientId', clientId);
        }
        let lastRevLine = 0;   //此时client.txt的最新行数

        function sendMsg() {
            const input = document.getElementById('msgInput');
            const msg = input.value.trim();
            if (!msg) return;

            // 准备数据
            line = line + 1;
            const data = {client_id: clientId, msg: msg, line: line};

            // 在消息面板显示发送的消息
            const div = document.createElement('div');
            div.className = 'msg msg-user';
            div.textContent = msg;
            document.getElementById('messages').appendChild(div);

            // 发送到后端
            fetch(CONFIG.BASE_URL + '/model/kefu/client_write.php', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify(data)
            })
            .then(res => {
                console.log('发送响应状态:', res.status);
                return res.json();
            })
            .then(data => {
                console.log('发送响应数据:', data);
                // 更新计数，避免轮询时重复显示
                lastRevLine = data.count;
            })
            .catch(err => {
                console.error('发送消息失败:', err);
                alert('发送失败: ' + err.message);
            });

            input.value = '';
        }

        // 轮询读取服务端回复
        function pollReply() {
            console.log('轮询请求:', CONFIG.BASE_URL + '/model/kefu/client_rev.php?client_id=' + clientId);
            fetch(CONFIG.BASE_URL + '/model/kefu/client_rev.php?client_id=' + clientId)
                .then(res => {
                    console.log('轮询响应状态:', res.status);
                    return res.json();
                })
                .then(data => {
                    console.log('轮询响应数据:', data);
                    console.log('data.length:', data.length, 'lastRevLine:', lastRevLine);
                    console.log('data[0]:', data[0]);
                    if (data.length > lastRevLine) {
                        // 有新回复
                        const div = document.getElementById('messages');
                        for (let i = lastRevLine; i < data.length; i++) {
                            const msgDiv = document.createElement('div');
                            msgDiv.className = 'msg';
                            if (data[i].msg.startsWith('客服:')) {
                                msgDiv.classList.add('msg-kefu');
                            } else {
                                msgDiv.classList.add('msg-user');
                            }
                            msgDiv.textContent = data[i].msg;
                            div.appendChild(msgDiv);
                        }
                        lastRevLine = data.length;
                        div.scrollTop = div.scrollHeight;
                    }
                })
                .catch(err => {
                    console.error('轮询失败:', err);
                });
        }

        // 每 3 秒轮询一次
        setInterval(pollReply, 3000);
    </script>
</body>
</html>
